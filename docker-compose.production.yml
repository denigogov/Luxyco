services:
  redis:
    image: redis:7-alpine
    container_name: luxyco-redis
    restart: unless-stopped
    ports:
      - "172.17.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in redis-production.env}"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
